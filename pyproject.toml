[project]
name = "deepaco"
version = "0.1.0"
description = "Reproduction environment for DeepACO: Neural-enhanced Ant Systems for Combinatorial Optimization"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "torch==1.7.0+cu110",
    "torch-scatter==2.0.7",
    "torch-sparse==0.6.9",
    "torch-geometric==2.0.4",
    "networkx==2.8.4",
    "numpy==1.23.3",
    "numba==0.56.4",
    "tqdm>=4.64,<5",
    "matplotlib>=3.7.5",
]

[project.optional-dependencies]
notebooks = [
    "d2l",
    "ipykernel>=6,<7",
    "jupyter>=1,<2",
    "matplotlib>=3.5,<4",
]

[tool.uv]
find-links = [
    "https://download.pytorch.org/whl/torch_stable.html",
    "https://data.pyg.org/whl/torch-1.7.0+cu110.html",
]
